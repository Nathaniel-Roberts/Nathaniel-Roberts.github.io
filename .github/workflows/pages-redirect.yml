# The site itself is built and hosted by Cloudflare Workers (see wrangler.jsonc).
# This workflow keeps the old nathaniel-roberts.github.io address alive as a
# redirect to nathanielroberts.tech so existing links keep working.
name: Publish GitHub Pages redirect

on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages-redirect.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect
      - id: deployment
        uses: actions/deploy-pages@v4
